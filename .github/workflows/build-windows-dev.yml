name: Build Windows (dev)

# Builds an unsigned Windows x64 installer (MSI) and portable zip from the current main branch,
# including the in-app Print dialog that lists the system printers (craft-print).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string baked into the build"
        type: string
        default: "0.6.2-dev"

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (MSVC, x64)
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
          rustup default stable
          rustc --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: win-x64-${{ hashFiles('Cargo.lock') }}

      - name: Install WiX v5
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2

      - name: Build and package
        shell: pwsh
        env:
          WORDCRAFT_VERSION: ${{ inputs.version }}
        run: pwsh packaging/windows/package.ps1 -Arch x64

      - name: Checksums
        shell: pwsh
        run: Get-ChildItem dist/release -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Tee-Object dist/release/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: wordcraft-windows-x64
          path: dist/release/*
          retention-days: 14

      - name: Publish as a release in this fork
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "dev-${{ github.run_number }}"
          gh release create $tag (Get-ChildItem dist/release -File).FullName --repo ${{ github.repository }} --target ${{ github.sha }} --prerelease --title "WordCraft ${{ inputs.version }} (Windows dev build $tag)" --notes "Unsigned Windows x64 build from main, with the Print dialog listing the system printers."
